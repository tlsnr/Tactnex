<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>SMOKELAB V3 – 3D-Prototyp</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#111;color:white;font:15px system-ui;touch-action:none}canvas{display:block}#hud{position:absolute;top:12px;left:12px;background:#101923d9;padding:12px;border-radius:12px;max-width:290px}#status{font-size:13px;color:#bfe2fa;margin-top:5px}#interact{position:absolute;right:22px;bottom:110px;padding:18px;border:0;border-radius:14px;background:#e5b24d;color:#171717;font-weight:bold;display:none}#pad{position:absolute;left:25px;bottom:35px;display:grid;grid-template-columns:repeat(3,55px);gap:5px}#pad button,#look button{background:#ffffff35;color:white;border:1px solid #ffffff66;border-radius:12px;height:52px;font-size:22px;touch-action:none}#pad button:active,#look button:active{background:#ffffff88}#look{position:absolute;right:20px;bottom:24px;display:flex;gap:8px}#note{position:absolute;top:12px;right:12px;font-size:12px;background:#101923b8;padding:8px;border-radius:8px}#cross{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none}button{cursor:pointer}</style></head><body><div id="hud"><b>SMOKELAB V3 · Kellerbrand</b><div id="status">Bewege dich zum Hauseingang.</div></div><div id="note">Prototyp · keine einsatztaktische Bewertung</div><div id="cross">+</div><button id="interact">Tür öffnen</button><div id="pad"><span></span><button data-key="forward">▲</button><span></span><button data-key="left">◀</button><button data-key="back">▼</button><button data-key="right">▶</button></div><div id="look"><button data-key="turnleft">↶</button><button data-key="turnright">↷</button></div><script type="module">
import * as THREE from 'https://esm.sh/three@0.170.0';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9eb7c9);scene.fog=new THREE.Fog(0x9eb7c9,25,70);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.08,120);camera.position.set(0,1.65,10);let yaw=0;
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x58616a,2));const sun=new THREE.DirectionalLight(0xffffff,2.1);sun.position.set(7,12,9);scene.add(sun);
function box(w,h,d,x,y,z,color){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color,roughness:.9}));m.position.set(x,y,z);scene.add(m);return m}
box(80,.15,80,0,-.12,0,0x547348);box(5,.05,18,0,.01,5,0xaaaaa3);
// House front wall with a real doorway gap: doorway x=-.8..+.8, house spans x=-5..5.
box(4.2,3.4,.25,-2.9,1.7,0,0xe8dfcd);box(4.2,3.4,.25,2.9,1.7,0,0xe8dfcd);box(1.6,.85,.25,0,2.975,0,0xe8dfcd);
box(.25,3.4,9,-5,1.7,-4.5,0xe8dfcd);box(.25,3.4,9,5,1.7,-4.5,0xe8dfcd);box(10,3.4,.25,0,1.7,-9,0xe8dfcd);box(10,.15,9,0,.01,-4.5,0xb4a797);
box(10,.3,9,0,3.55,-4.5,0x5e5754);
for(const x of [-3.2,3.2]){box(1.6,1.5,.05,x,1.8,.15,0x536c77);box(.08,1.6,.1,x,1.8,.2,0xffffff);box(1.6,.08,.1,x,1.8,.2,0xffffff)}
const hinge=new THREE.Group();hinge.position.set(-.8,0,.02);scene.add(hinge);const door=new THREE.Mesh(new THREE.BoxGeometry(1.6,2.12,.1),new THREE.MeshStandardMaterial({color:0x805a3c}));door.position.set(.8,1.06,0);hinge.add(door);const handle=new THREE.Mesh(new THREE.SphereGeometry(.065,12,12),new THREE.MeshStandardMaterial({color:0xd4bc79}));handle.position.set(1.42,1.06,.08);hinge.add(handle);
// Interior hall, stairs represented by a visible descent at the back.
box(2,.08,4,0,.08,-6.7,0x706f6b);for(let i=0;i<7;i++)box(2,.13,.38,0,.13-i*.07,-6.5-i*.37,0x6b6761);
const basementDoor=box(2,2.2,.12,0,1.1,-8.6,0x544b42);
const keys=new Set(),status=document.querySelector('#status'),action=document.querySelector('#interact');let open=false;
function interact(){if(Math.hypot(camera.position.x,camera.position.z)<3.2&&camera.position.z>-2.5){open=!open;status.textContent=open?'Haustür geöffnet. Du kannst in den Flur gehen.':'Haustür geschlossen.'}}
action.addEventListener('click',interact);document.addEventListener('keydown',e=>{keys.add(e.key.toLowerCase());if(e.key.toLowerCase()==='e')interact()});document.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
for(const b of document.querySelectorAll('[data-key]')){const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(k)});for(const evt of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(evt,()=>keys.delete(k))}
let touchX=null;renderer.domElement.addEventListener('pointerdown',e=>{touchX=e.clientX});renderer.domElement.addEventListener('pointermove',e=>{if(touchX!==null){yaw-=(e.clientX-touchX)*.004;touchX=e.clientX}});renderer.domElement.addEventListener('pointerup',()=>touchX=null);
let prev=performance.now();function tick(t){const dt=Math.min((t-prev)/1000,.04);prev=t;const turn=(keys.has('turnleft')||keys.has('arrowleft')?1:0)-(keys.has('turnright')||keys.has('arrowright')?1:0);yaw+=turn*dt*1.7;camera.rotation.y=yaw;let f=Number(keys.has('forward')||keys.has('w')||keys.has('arrowup'))-Number(keys.has('back')||keys.has('s')||keys.has('arrowdown'));let s=Number(keys.has('right')||keys.has('d'))-Number(keys.has('left')||keys.has('a'));const speed=3.2*dt;const nx=camera.position.x+(Math.sin(yaw)*-f+Math.cos(yaw)*s)*speed,nz=camera.position.z+(-Math.cos(yaw)*f-Math.sin(yaw)*s)*speed;
const crossing=nz<.3&&nz>-.3&&Math.abs(nx)<.82;const blocked=!open&&crossing;const inHouse=nx>-4.7&&nx<4.7&&nz<0&&nz>-8.5;const valid=!(nz<-.1&&nz>-8.8&&Math.abs(nx)>4.65)&&!blocked&&!(nz< -8.6);if(valid){camera.position.x=nx;camera.position.z=nz}camera.position.y=1.65;
const near=Math.abs(camera.position.x)<2&&Math.abs(camera.position.z)<2.6;action.style.display=near?'block':'none';action.textContent=open?'Tür schließen':'Tür öffnen';if(inHouse&&camera.position.z< -5.4)status.textContent='Kellertreppe erreicht. Weitere Interaktionen folgen in der nächsten Version.';else if(inHouse)status.textContent='Im Hausflur. Gehe zur Kellertreppe.';renderer.render(scene,camera);requestAnimationFrame(tick)}requestAnimationFrame(tick);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
