<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>TactNex – v0.4 Entwicklung</title><style>html,body{margin:0;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;height:100%;overflow:hidden;background:#111;color:white;font:15px system-ui;touch-action:none}canvas{display:block;touch-action:none;-webkit-user-select:none}button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}#pad,#look{z-index:20;touch-action:none}#pad button,#look button{min-width:55px;min-height:55px;opacity:1}#hud,#note{pointer-events:none}#interact{z-index:20}#hud{position:absolute;top:12px;left:12px;background:#101923d9;padding:12px;border-radius:12px;max-width:290px}#status{font-size:13px;color:#bfe2fa;margin-top:5px}#interact{position:absolute;right:22px;bottom:110px;padding:18px;border:0;border-radius:14px;background:#e5b24d;color:#171717;font-weight:bold;display:none}#pad{position:absolute;left:25px;bottom:35px;display:grid;grid-template-columns:repeat(3,55px);gap:5px}#pad button,#look button{background:#ffffff35;color:white;border:1px solid #ffffff66;border-radius:12px;height:52px;font-size:22px;touch-action:none}#pad button:active,#look button:active{background:#ffffff88}#look{position:absolute;right:20px;bottom:24px;display:flex;gap:8px}#note{position:absolute;top:12px;right:12px;font-size:12px;background:#101923b8;padding:8px;border-radius:8px}#cross{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none}button{cursor:pointer}</style></head><body><div id="hud"><b>TactNex · Kellerbrand</b><div id="status">Links: Bewegungstasten. Rechts auf dem Bild wischen: umsehen, auch hoch/runter.</div></div><div id="note">Prototyp · keine einsatztaktische Bewertung</div><div id="cross">+</div><button id="interact">Tür öffnen</button><div id="pad"><span></span><button data-key="fo import * as THREE from 'https://esm.sh/three@0.170.0';

box(80,.15,80,0,-.12,0,0x547348);box(5,.05,18,0,.01,5,0xaaaaa3);

const hinge=new THREE.Group();hinge.position.set(-.8,0,.02);scene.add(hinge);const door=new THREE.Mesh(new THREE.BoxGeometry(1.6,2.12,.1),new THREE.MeshStandardMaterial({color:0x805a3c}));door.position.set(.8,1.06,0);hinge.add(door);const handle=new THREE.Mesh(new THREE.SphereGeometry(.065,12,12),new THREE.MeshStandardMaterial({color:0xd4bc79}));handle.position.set(1.42,1.06,.08);hinge.add(handle);

// An open basement volume behind the staircase, with walls and floor.
box(9,.16,8,0,-2.78,-13,0x80766c);
box(.2,2.7,8,-4.5,-1.35,-13,0xc9c2b7);box(.2,2.7,8,4.5,-1.35,-13,0xc9c2b7);
box(9,2.7,.2,0,-1.35,-17,0xc9c2b7);
// Staircase goes from z=-5.4 at ground level to z=-10.4 at basement level.
const stairStart=-5.4,stairEnd=-10.4,stairCount=14;
for(let i=0;i<stairCount;i++){const z=stairStart-(i+.5)*(5/stairCount);const y=-(i+1)*2.7/stairCount;box(1.9,.12,5/stairCount,0,y-.07,z,0x77716b)}

// Expanded outdoor scene: procedural trees, driveway and parked vehicle.
function tree(x,z,s=1){const trunk=box(.32*s,2.2*s,.32*s,x,1.1*s,z,0x654630);for(let i=0;i<3;i++){const crown=new THREE.Mesh(new THREE.ConeGeometry((1.3-i*.2)*s,1.6*s,7),new THREE.MeshStandardMaterial({color:i%2?0x315f35:0x3d7841,roughness:1}));crown.position.set(x,(2.3+i*.75)*s,z);scene.add(crown)}}
for(const [x,z,s] of [[-9,6,1.1],[9,8,1.25],[-11,-5,.9],[11,-9,1.2],[-15,14,1.4],[15,16,1]])tree(x,z,s);
box(5,.07,15,7.8,.02,6,0x777b7b);box(25,.05,5,0,.02,18,0x62666b);
const car=new THREE.Group();scene.add(car);function carPart(w,h,d,x,y,z,col){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:col,metalness:.2,roughness:.55}));m.position.set(x,y,z);car.add(m)}
car.position.set(8,0,7);carPart(1.9,.65,4.1,0,.65,0,0x274b6d);carPart(1.65,.6,2,0,1.25,-.25,0x375c78);for(const x of [-.93,.93])for(const z of [-1.25,1.25]){const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.37,.37,.18,12),new THREE.MeshStandardMaterial({color:0x191b1c}));wheel.rotation.z=Math.PI/2;wheel.position.set(x,.38,z);car.add(wheel)}
// Training fire and smoke: visual effects only, not validated fire dynamics.
const fireGroup=new THREE.Group();fireGroup.position.set(-2,-2.6,-14.4);scene.add(fireGroup);
for(let i=0;i<7;i++){const flame=new THREE.Mesh(new THREE.ConeGeometry(.25+i*.035,.75+i*.1,6),new THREE.MeshBasicMaterial({color:i%2?0xffaa16:0xff4d0a,transparent:true,opacity:.76,depthWrite:false}));flame.position.set((i%3-1)*.27,.38+(i%2)*.15,Math.floor(i/3)*.24);fireGroup.add(flame)}
const fireLight=new THREE.PointLight(0xff5b16,4,9);fireLight.position.set(-2,-1.8,-14.4);scene.add(fireLight);
const smoke=[];for(let i=0;i<14;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.35,7,5),new THREE.MeshBasicMaterial({color:0x4d5154,transparent:true,opacity:.13,depthWrite:false}));scene.add(m);smoke.push(m)}
// Visible first-person equipment selection, with basic 3D handheld silhouettes.
const hand=new THREE.Group();camera.add(hand);scene.add(camera);hand.position.set(.52,-.46,-.85);
const glove=new THREE.Mesh(new THREE.BoxGeometry(.18,.19,.36),new THREE.MeshStandardMaterial({color:0x1e2427}));glove.position.set(0,-.09,.12);hand.add(glove);
const held=new THREE.Group();hand.add(held);
function equipment(name){held.clear();const mat=(color)=>new THREE.MeshStandardMaterial({color,metalness:.18,roughness:.6});const add=(geo,x,y,z,color)=>{const m=new THREE.Mesh(geo,mat(color));m.position.set(x,y,z);held.add(m);return m};
if(name==='Wärmebildkamera'){add(new THREE.BoxGeometry(.36,.36,.19),0,.12,-.18,0x252a2e);add(new THREE.BoxGeometry(.28,.2,.012),0,.17,-.287,0x517986);add(new THREE.BoxGeometry(.12,.35,.13),0,-.22,-.12,0x202428)}
else if(name==='Messgerät'){add(new THREE.BoxGeometry(.23,.44,.12),0,.1,-.18,0x25292d);add(new THREE.BoxGeometry(.17,.19,.015),0,.15,-.247,0xb0d6e1)}
else if(name==='Strahlrohr'){const m=add(new THREE.CylinderGeometry(.065,.11,.65,12),0,.08,-.25,0x666c70);m.rotation.x=Math.PI/2;add(new THREE.TorusGeometry(.13,.035,7,12),0,.08,-.53,0x282c30)}
else if(name==='Feuerwehraxt'){const m=add(new THREE.CylinderGeometry(.025,.035,.85,8),0,.14,-.2,0x6c482b);m.rotation.z=-.2;add(new THREE.BoxGeometry(.35,.2,.065),-.04,.55,-.2,0x9ba5a9)}
else if(name==='Halligan'){const m=add(new THREE.CylinderGeometry(.025,.025,.85,8),0,.15,-.2,0x666e76);m.rotation.z=.2;add(new THREE.BoxGeometry(.28,.07,.07),-.1,.55,-.2,0x8b9299)}
else if(name==='Funkgerät'){add(new THREE.BoxGeometry(.19,.3,.09),0,.1,-.2,0x22272b);add(new THREE.CylinderGeometry(.012,.012,.2,8),.06,.35,-.2,0x171a1b)}}
const equipUI=document.createElement('div');equipUI.style.cssText='position:absolute;bottom:16px;left:50%;transform:translateX(-50%);z-index:25;display:flex;gap:5px;max-width:60vw;overflow-x:auto;padding:5px;background:#101923b8;border-radius:12px';document.body.append(equipUI);
for(const name of ['Hände','Strahlrohr','Wärmebildkamera','Messgerät','Feuerwehraxt','Halligan','Funkgerät']){const b=document.createElement('button');b.textContent=name;b.style.cssText='white-space:nowrap;border:1px solid #ffffff88;border-radius:8px;background:#344553;color:white;padding:10px;font-size:12px';b.onclick=()=>{equipment(name);for(const x of equipUI.children)x.style.background='#344553';b.style.background='#aa7829';status.textContent=name+' ausgewählt (3D-Testmodell).'};equipUI.append(b)}
equipment('Hände');
const keys=new Set(),status=document.querySelector('#status'),action=document.querySelector('#interact');let open=false,doorAngle=0;
function interact(){if(Math.abs(camera.position.x)<2.1&&Math.abs(camera.position.z)<2.7){open=!open;status.textContent=open?'Haustür öffnet sich.':'Haustür schließt sich.'}}
action.addEventListener('click',interact);document.addEventListener('keydown',e=>{keys.add(e.key.toLowerCase());if(e.key.toLowerCase()==='e')interact()});document.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('selectstart',e=>e.preventDefault());document.addEventListener('dragstart',e=>e.preventDefault());
for(const b of document.querySelectorAll('[data-key]')){const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(k)});for(const evt of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(evt,()=>keys.delete(k))}
let lookPointer=null,lookX=0,lookY=0;
renderer.domElement.addEventListener('pointerdown',e=>{lookPointer=e.pointerId;lookX=e.clientX;lookY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});
renderer.domElement.addEventListener('pointermove',e=>{if(e.pointerId!==lookPointer)return;const dx=e.clientX-lookX,dy=e.clientY-lookY;yaw-=dx*.004;pitch=Math.max(-1.25,Math.min(1.25,pitch-dy*.004));lookX=e.clientX;lookY=e.clientY});
for(const ev of ['pointerup','pointercancel','lostpointercapture'])renderer.domElement.addEventListener(ev,e=>{if(e.pointerId===lookPointer)lookPointer=null});
let prev=performance.now();function tick(t){const dt=Math.min((t-prev)/1000,.04);prev=t;const turn=(keys.has('turnleft')||keys.has('arrowleft')?1:0)-(keys.has('turnright')||keys.has('arrowright')?1:0);yaw+=turn*dt*1.7;camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;
const targetAngle=open?-Math.PI*.55:0;doorAngle+=(targetAngle-doorAngle)*Math.min(1,dt*7);hinge.rotation.y=doorAngle;let f=Number(keys.has('forward')||keys.has('w')||keys.has('arrowup'))-Number(keys.has('back')||keys.has('s')||keys.has('arrowdown'));let s=Number(keys.has('right')||keys.has('d'))-Number(keys.has('left')||keys.has('a'));const speed=3.2*dt;const nx=camera.position.x+(Math.sin(yaw)*-f+Math.cos(yaw)*s)*speed,nz=camera.position.z+(-Math.cos(yaw)*f-Math.sin(yaw)*s)*speed;
// Collision with front wall and door: test the entire movement segment, not only the endpoint.
const px=camera.position.x,pz=camera.position.z,r=.24;
function passable(x,z){
  if(z < -16.65 || (z < -.3 && (x < -4.65 || x > 4.65))) return false;
  // Front wall is at z=0; doorway is x=-0.8..0.8.
  if(Math.abs(z)<.18+r){
    if(Math.abs(x)>.8-r)return false;
    if(!open || Math.abs(doorAngle)<1.12)return false;
  }
  // Door leaf swings toward exterior on the left hinge; approximate solid segment.
  const ax=-.8,az=.02,bx=ax+1.6*Math.cos(doorAngle),bz=az-1.6*Math.sin(doorAngle);
  const vx=bx-ax,vz=bz-az,wx=x-ax,wz=z-az;
  const u=Math.max(0,Math.min(1,(wx*vx+wz*vz)/(vx*vx+vz*vz)));
  if(Math.hypot(x-(ax+u*vx),z-(az+u*vz))<r+.07)return false;
  return true;
}
let cx=px,cz=pz;const steps=Math.max(1,Math.ceil(Math.hypot(nx-px,nz-pz)/.09));
for(let i=1;i<=steps;i++){const tx=px+(nx-px)*i/steps,tz=pz+(nz-pz)*i/steps;if(passable(tx,tz)){cx=tx;cz=tz}else break}
camera.position.x=cx;camera.position.z=cz;
const inHouse=cx>-4.7&&cx<4.7&&cz<-.3&&cz>-16.7;
const stairProgress=Math.max(0,Math.min(1,(-cz-5.4)/5));camera.position.y=1.65-2.7*stairProgress;
const near=Math.abs(camera.position.x)<2&&Math.abs(camera.position.z)<2.6;action.style.display=near?'block':'none';action.textContent=open?'Tür schließen':'Tür öffnen';if(inHouse&&camera.position.z< -10.4)status.textContent='Im Kellergeschoss (Testbereich).';else if(inHouse&&camera.position.z< -5.4)status.textContent='Du gehst die Kellertreppe hinunter.';else if(inHouse)status.textContent='Im Hausflur. Gehe zur Kellertreppe.';for(let i=0;i<smoke.length;i++){const a=t*.00025+i*2.4;smoke[i].position.set(-2+Math.sin(a+i)*.5,-2.15+((t*.0003+i*.17)%3),-14.4+Math.cos(a+i)*.4);smoke[i].scale.setScalar(.7+((t*.0003+i*.17)%3)*.55)}fireLight.intensity=3.2+Math.sin(t*.013)*.9;for(let i=0;i<fireGroup.children.length;i++)fireGroup.children[i].scale.y=.8+Math.sin(t*.009+i)*.2;renderer.render(scene,camera);requestAnimationFrame(tick)}requestAnimationFrame(tick);
