const keys=new Set(),status=document.querySelector('#status'),action=document.querySelector('#interact');let open=false,doorAngle=0;

action.addEventListener('click',interact);document.addEventListener('keydown',e=>{keys.add(e.key.toLowerCase());if(e.key.toLowerCase()==='e')interact()});document.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('selectstart',e=>e.preventDefault());document.addEventListener('dragstart',e=>e.preventDefault());

let prev=performance.now();function tick(t){const dt=Math.min((t-prev)/1000,.04);prev=t;const turn=(keys.has('turnleft')||keys.has('arrowleft')?1:0)-(keys.has('turnright')||keys.has('arrowright')?1:0);yaw+=turn*dt*1.7;camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;
const targetAngle=open?-Math.PI*.55:0;doorAngle+=(targetAngle-doorAngle)*Math.min(1,dt*7);hinge.rotation.y=doorAngle;let f=Number(keys.has('forward')||keys.has('w')||keys.has('arrowup'))-Number(keys.has('back')||keys.has('s')||keys.has('arrowdown'));let s=Number(keys.has('right')||keys.has('d'))-Number(keys.has('left')||keys.has('a'));const speed=3.2*dt;const nx=camera.position.x+(Math.sin(yaw)*-f+Math.cos(yaw)*s)*speed,nz=camera.position.z+(-Math.cos(yaw)*f-Math.sin(yaw)*s)*speed;

const px=camera.position.x,pz=camera.position.z,r=.24;
function passable(x,z){
  if(z < -16.65 || (z < -.3 && (x < -4.65 || x > 4.65))) return false;
  // Front wall is at z=0; doorway is x=-0.8..0.8.
  if(Math.abs(z)<.18+r){
    if(Math.abs(x)>.8-r)return false;
    if(!open || Math.abs(doorAngle)<1.12)return false;
  }
  // Door leaf swings toward exterior on the left hinge; approximate solid segment.
  const ax=-.8,az=.02,bx=ax+1.6*Math.cos(doorAngle),bz=az-1.6*Math.sin(doorAngle);

  return true;
}
let cx=px,cz=pz;const steps=Math.max(1,Math.ceil(Math.hypot(nx-px,nz-pz)/.09));
for(let i=1;i<=steps;i++){const tx=px+(nx-px)*i/steps,tz=pz+(nz-pz)*i/steps;if(passable(tx,tz)){cx=tx;cz=tz}else break}

const stairProgress=Math.max(0,Math.min(1,(-cz-5.4)/5));camera.position.y=1.65-2.7*stairProgress;
const near=Math.abs(camera.position.x)<2&&Math.abs(camera.position.z)<2.6;action.style.display=near?'block':'none';action.textContent=open?'Tür schließen':'Tür öffnen';if(inHouse&&camera.position.z< -10.4)status.textContent='Im Kellergeschoss (Testbereich).';else if(inHouse&&camera.position.z< -5.4)status.textContent='Du gehst die Kellertreppe hinunter.';else if(inHouse)status.textContent='Im Hausflur. Gehe zur Kellertreppe.';for(let i=0;i<smoke.length;i++){const a=t*.00025+i*2.4;smoke[i].position.set(-2+Math.sin(a+i)*.5,-2.15+((t*.0003+i*.17)%3),-14.4+Math.cos(a+i)*.4);smoke[i].scale.setScalar((.7+((t*.0003+i*.17)%3)*.55)*Math.max(.1,fireStrength));smoke[i].visible=fireStrength>.05}fireLight.intensity=fireStrength*(3.2+Math.sin(t*.013)*.9);fireGroup.scale.setScalar(Math.max(.05,fireStrength));if(waterOn&&selectedEquipment==='Strahlrohr'){const forward=new THREE.Vector3();camera.getWorldDirection(forward);const origin=camera.position.clone().addScaledVector(forward,.6);const target=new THREE.Vector3(-2,-1.8,-14.4);if(forward.dot(target.clone().sub(camera.position).normalize())>.89&&camera.position.distanceTo(target)<10){fireStrength=Math.max(0,fireStrength-dt*.15);if(fireStrength<.06)status.textContent='Brandherd im Übungsszenario gelöscht.'}for(let i=0;i<waterDroplets.length;i++){const p=waterDroplets[i];const dist=.6+((t*.005+i*.17)%7);p.position.copy(origin).addScaledVector(forward,dist);p.position.y-=dist*dist*.012;p.position.x+=Math.sin(i*15.4)*dist*.018;p.visible=true}}else for(const p of waterDroplets)p.visible=false;for(let i=0;i<fireGroup.children.length;i++)fireGroup.children[i].scale.y=.8+Math.sin(t*.009+i)*.2;renderer.render(scene,camera);requestAnimationFrame(tick)}requestAnimationFrame(tick);
